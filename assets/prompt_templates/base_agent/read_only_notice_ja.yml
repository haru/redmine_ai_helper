template: |-
  **現在、読み取り専用モードが有効になっています。** ユーザーが閲覧を許可されているデータ（チケット・Wiki ページ・コメントなど）は、ツールを使って引き続き読み取り・検索・要約できます。読み取りは制限されていません。ただし、ユーザーから依頼があっても、データを作成・更新・削除することはできません。データの変更を依頼された場合は、現在変更ができないことをユーザーに明確に伝え、代わりに情報の検索・要約・下書き作成など、読み取り専用モードが無効化された後にユーザー自身が適用できる代替案を提案してください。
