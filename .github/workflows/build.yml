name: build
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - '.devcontainer/**'
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
      - 'wiki/**'
      - '.specify/**'
      - '.agent/**'
      - '.vscode/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - 'version.rb'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - '.devcontainer/**'
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
      - 'wiki/**'
      - '.specify/**'
      - '.agent/**'
      - '.vscode/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - 'version.rb'
  workflow_dispatch:
env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ruby:4.0
    steps:
      - uses: actions/checkout@v7
      - name: Install RuboCop
        run: gem install rubocop rubocop-rails rubocop-performance rubocop-factory_bot
      - name: RuboCop
        run: rubocop

  size-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc
      - name: Code size summary
        continue-on-error: true
        run: |
          { echo "## 📊 Code size"; cloc --md app lib assets/javascripts; } >> "$GITHUB_STEP_SUMMARY"

  javascript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: JS test/coverage summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## 🧪 JavaScript test results"
            jq -r '"- Test Files: \(.numTotalTestSuites) (failed: \(.numFailedTestSuites))\n- Tests: \(.numTotalTests) total (failed: \(.numFailedTests))"' vitest-results.json
            echo ""
            echo "## 📈 JavaScript coverage"
            jq -r '.total | "- Lines: \(.lines.pct)%\n- Statements: \(.statements.pct)%\n- Functions: \(.functions.pct)%\n- Branches: \(.branches.pct)%"' coverage-js/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        if: env.CODECOV_TOKEN != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-js/lcov.info
          flags: javascript
          fail_ci_if_error: true

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # Supported Matrix:
    # Redmine 6.0-stable: Ruby 3.1, 3.2, 3.3
    # Redmine 6.1-stable: Ruby 3.2, 3.3, 3.4
    # Redmine 7.0-stable: Ruby 3.2, 3.3, 3.4, 4.0
    # Redmine master: Ruby 3.3, 3.4, 4.0
    strategy:
      max-parallel: 10
      matrix:
        db: [sqlite3, mysql, postgres]
        ruby_version: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        redmine_version: [6.0-stable, 6.1-stable, 7.0-stable, master]
        exclude:
          - ruby_version: "3.4"
            redmine_version: 6.0-stable
          - ruby_version: "4.0"
            redmine_version: 6.0-stable
          - ruby_version: "3.1"
            redmine_version: 6.1-stable
          - ruby_version: "4.0"
            redmine_version: 6.1-stable
          - ruby_version: "3.1"
            redmine_version: 7.0-stable
          - ruby_version: "3.1"
            redmine_version: master
          - ruby_version: "3.2"
            redmine_version: master
    services:
      mysql:
        image: mysql:8.1
        options: --health-cmd "mysqladmin ping -h localhost" --health-interval 20s --health-timeout 10s --health-retries 10
        env:
          MYSQL_ROOT_PASSWORD: dbpassword
      postgres:
        image: postgres
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dbpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    container:
      image: ruby:${{ matrix.ruby_version }}
      env:
        DB: ${{ matrix.db }}
        DB_USERNAME: root
        DB_PASSWORD: dbpassword
        DB_HOST: ${{ matrix.db }}
        REDMINE_VER: ${{ matrix.redmine_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: bash -x ./.github/build-scripts/install.sh
      - name: Test Migration Rollback
        run: bash -x ./.github/build-scripts/test-migration-rollback.sh
      - name: Build
        run: bash -x ./.github/build-scripts/build.sh
      - name: Enforce YARD Documentation Coverage
        run: |
          output=$(bundle exec yard stats --list-undoc | tee /dev/stderr)
          if ! printf '%s' "$output" | grep -q "100.00%"; then
            echo "YARD documentation coverage is below 100%. See report above." >&2
            exit 1
          fi
      - name: Clean
        run: bash -x ./.github/build-scripts/cleanup.sh
      - name: Ruby test/coverage summary
        if: matrix.ruby_version == '3.4' && matrix.redmine_version == '7.0-stable' && matrix.db == 'sqlite3'
        continue-on-error: true
        run: |
          {
            echo "## 🧪 Ruby test results (ruby 3.4 / redmine 7.0-stable / sqlite3)"
            grep -E '^[0-9]+ runs, [0-9]+ assertions' ruby-test-output.log || echo "(summary line not found)"
            echo ""
            echo "## 📈 Ruby coverage"
            line_rate=$(grep -oP '(?<=line-rate=")[^"]+' coverage/coverage.xml | head -1)
            awk -v r="$line_rate" 'BEGIN { printf "- Lines: %.2f%%\n", r * 100 }'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        if: env.CODECOV_TOKEN != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ruby
          fail_ci_if_error: true

  notify:
    name: Slack Notification on Failure
    needs: [lint, build, javascript]
    if: always() && (needs.lint.result == 'failure' || needs.build.result == 'failure' || needs.javascript.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        if: env.SLACK_WEBHOOK != ''
        env:
          SLACK_CHANNEL: general
          SLACK_TITLE: Test Failure
          SLACK_COLOR: danger
