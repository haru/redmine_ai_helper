require:
  - rubocop-rails
  - rubocop-performance
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  Exclude:
    - 'db/**/*'


# inherit_from: .rubocop_todo.yml

# All cops except your using extensions are disabled by default.
Bundler:
  Enabled: true
Gemspec:
  Enabled: true
Layout:
  Enabled: false
Lint:
  Enabled: true
Metrics:
  Enabled: true

Metrics/AbcSize:
  Max: 45
  Exclude:
    - "test/**/*"
    - "lib/redmine_ai_helper/tools/**/*"
    - "lib/redmine_ai_helper/project_metrics_calculator.rb"

Metrics/BlockLength:
  Max: 70
  Exclude:
    - "test/**/*"
    - "config/routes.rb"
    - "lib/tasks/**/*"

Metrics/BlockNesting:
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Max: 650
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Max: 15
  Exclude:
    - "test/**/*"
    - "lib/redmine_ai_helper/tools/**/*"
    - "lib/redmine_ai_helper/project_metrics_calculator.rb"

Metrics/MethodLength:
  Max: 70
  Exclude:
    - "test/**/*"
    - "lib/redmine_ai_helper/tools/**/*"

Metrics/ModuleLength:
  Max: 300
  Exclude:
    - "test/**/*"

Metrics/ParameterLists:
  Max: 8
  Exclude:
    - "test/**/*"
    - "lib/redmine_ai_helper/tools/**/*"

Metrics/PerceivedComplexity:
  Max: 21
  Exclude:
    - "test/**/*"
    - "lib/redmine_ai_helper/tools/**/*"
Naming:
  Enabled: false
Performance:
  Enabled: false
  Exclude:
    - "test/**/*"
Rails:
  Enabled: true
Security:
  Enabled: true
Style:
  Enabled: false

# Align `when` with `end`.
Layout/CaseIndentation:
  Enabled: true
  EnforcedStyle: end

# Align comments with method definitions.
Layout/CommentIndentation:
  Enabled: true

Layout/ElseAlignment:
  Enabled: true

Layout/EmptyLineAfterMagicComment:
  Enabled: true

Layout/EmptyLinesAroundBlockBody:
  Enabled: true

# In a regular class definition, no empty lines around the body.
Layout/EmptyLinesAroundClassBody:
  Enabled: true

# In a regular method definition, no empty lines around the body.
Layout/EmptyLinesAroundMethodBody:
  Enabled: true

# In a regular module definition, no empty lines around the body.
Layout/EmptyLinesAroundModuleBody:
  Enabled: true

# Align `end` with the matching keyword or starting expression except for
# assignments, where it should be aligned with the LHS.
Layout/EndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: variable

# Method definitions after `private` or `protected` isolated calls need one
# extra level of indentation.
#
# We break this rule in context, though, e.g. for private-only concerns,
# so we leave it disabled.
Layout/IndentationConsistency:
  Enabled: false
  EnforcedStyle: indented_internal_methods

# Detect hard tabs, no hard tabs.
Layout/IndentationStyle:
  Enabled: true

# Two spaces, no tabs (for indentation).
#
# Doesn't behave properly with private-only concerns, so it's disabled.
Layout/IndentationWidth:
  Enabled: false

Layout/LeadingCommentSpace:
  Enabled: true

Layout/SpaceAfterColon:
  Enabled: true

Layout/SpaceAfterComma:
  Enabled: true

Layout/SpaceAroundEqualsInParameterDefault:
  Enabled: true

Layout/SpaceAroundKeyword:
  Enabled: true

# Use `foo {}` not `foo{}`.
Layout/SpaceBeforeBlockBraces:
  Enabled: true

Layout/SpaceBeforeComma:
  Enabled: true

Layout/SpaceBeforeFirstArg:
  Enabled: true

# Use `->(x, y) { x + y }` not `-> (x, y) { x + y }`
Layout/SpaceInLambdaLiteral:
  Enabled: true

# Use `[ a, [ b, c ] ]` not `[a, [b, c]]`
# Use `[]` not `[ ]`
Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: true
  EnforcedStyle: space
  EnforcedStyleForEmptyBrackets: no_space

# Use `%w[ a b ]` not `%w[ a   b ]`.
Layout/SpaceInsideArrayPercentLiteral:
  Enabled: true

# Use `foo { bar }` not `foo {bar}`.
# Use `foo { }` not `foo {}`.
Layout/SpaceInsideBlockBraces:
  Enabled: true
  EnforcedStyleForEmptyBraces: space

# Use `{ a: 1 }` not `{a:1}`.
# Use `{}` not `{  }`.
Layout/SpaceInsideHashLiteralBraces:
  Enabled: true
  EnforcedStyle: space
  EnforcedStyleForEmptyBraces: no_space

# Use `foo(bar)` not `foo( bar )`
Layout/SpaceInsideParens:
  Enabled: true

# Requiring a space is not yet supported as of 0.59.2
# Use `%w[ foo ]` not `%w[foo]`
Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: false
  #EnforcedStyle: space

# Use `hash[:key]` not `hash[ :key ]`
Layout/SpaceInsideReferenceBrackets:
  Enabled: true

# Blank lines should not have any spaces.
Layout/TrailingEmptyLines:
  Enabled: true

# No trailing whitespace.
Layout/TrailingWhitespace:
  Enabled: true

Lint/RedundantStringCoercion:
  Enabled: true

# Use my_method(my_arg) not my_method( my_arg ) or my_method my_arg.
Lint/RequireParentheses:
  Enabled: true

Lint/UriEscapeUnescape:
  Enabled: true

Performance/FlatMap:
  Enabled: true

# Redmine plugin tests use ActionController::TestCase which provides controller-specific helpers
Rails/ActionControllerTestCase:
  Enabled: false

# belongs_to implicit presence validation puts errors on the association name, not the foreign key.
# Explicit validates :foreign_key_id keeps error keys consistent for test assertions.
Rails/RedundantPresenceValidationOnBelongsTo:
  Enabled: false

# Unique index requirement is a DB-level concern managed separately from model validations.
Rails/UniqueValidationWithoutIndex:
  Enabled: false

# Rails/Pluck mis-fires on plain Ruby arrays (not ActiveRecord relations).
Rails/Pluck:
  Enabled: false

# Test setup intentionally bypasses validations to set specific state
Rails/SkipsModelValidations:
  Exclude:
    - "test/**/*"

# Prefer assert_not over assert !
Rails/AssertNot:
  Include:
    - "test/**/*"

# Prefer assert_not_x over refute_x
Rails/RefuteMethods:
  Include:
    - "test/**/*"

# params.expect is unavailable on the older Rails versions bundled with
# Redmine 6.0/6.1-stable, which this plugin must still support.
Rails/StrongParametersExpect:
  Enabled: false

# We generally prefer &&/|| but like low-precedence and/or in context
Style/AndOr:
  Enabled: false

# Prefer Foo.method over Foo::method
Style/ColonMethodCall:
  Enabled: true

Style/DefWithParentheses:
  Enabled: true

# Use Ruby >= 1.9 syntax for hashes. Prefer { a: :b } over { :a => :b }.
Style/HashSyntax:
  Enabled: true
  EnforcedShorthandSyntax: either

# Defining a method with parameters needs parentheses.
Style/MethodDefParentheses:
  Enabled: true

Style/ParenthesesAroundCondition:
  Enabled: true

Style/PercentLiteralDelimiters:
  Enabled: true
  PreferredDelimiters:
    default: "()"
    "%i": "[]"
    "%I": "[]"
    "%r": "{}"
    "%w": "[]"
    "%W": "[]"

# Use quotes for string literals when they are enough.
Style/RedundantPercentQ:
  Enabled: false

Style/RedundantReturn:
  Enabled: true
  AllowMultipleReturnValues: true

Style/Semicolon:
  Enabled: true
  AllowAsExpressionSeparator: true

Style/StabbyLambdaParentheses:
  Enabled: true

# Use `"foo"` not `'foo'` unless escaping is required
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes
  Include:
    - "app/**/*"
    - "config/**/*"
    - "lib/**/*"
    - "test/**/*"
    - "Gemfile"
    - "db/seeds.rb"

Style/TrailingCommaInArguments:
  Enabled: true

Style/TrailingCommaInArrayLiteral:
  Enabled: true

Style/TrailingCommaInHashLiteral:
  Enabled: true
